name: Deploy to Production

on:
  workflow_dispatch:

# Prevent concurrent deploys — queue them instead
# If two pushes happen at the same time, the second waits for the first to finish
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Check if deploy secrets are configured
  check-config:
    name: Check deploy config
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Deploy secrets not configured. Skipping deploy."
            echo "Add SSH_HOST, SSH_KEY, SSH_USER, REMOTE_PATH, DB_NAME, DB_USER, DB_PASS to enable."
          fi

  deploy:
    name: Deploy via rsync
    runs-on: ubuntu-latest
    needs: [check-config]
    if: needs.check-config.outputs.configured == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ vars.SSH_PORT || '22' }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          echo "Files transferred:"
          rsync -rlpgoDz --checksum --out-format='%n' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='config.php' \
            --exclude='config-dist.php' \
            --exclude='admin/config.php' \
            --exclude='admin/config-dist.php' \
            --exclude='.env' \
            --exclude='system/storage/' \
            --exclude='image/' \
            --exclude='docker/' \
            --exclude='docker-compose.yml' \
            --exclude='scripts/' \
            --exclude='install/' \
            --exclude='/.htaccess' \
            --exclude='/.htaccess.txt' \
            --exclude='.user.ini' \
            --exclude='README.md' \
            --exclude='catalog/view/theme/journal3/assets/*' \
            --exclude='error_log' \
            --exclude='.gitignore' \
            --exclude='php.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.SSH_PORT || '22' }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/ \
            | grep -v '/$' | grep -v '^$' || echo "(none)"

      - name: Verify site is up
        id: smoke_test
        continue-on-error: true
        run: |
          sleep 5
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" ${{ vars.SITE_URL }})
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "Site returns HTTP $STATUS - OK"
          else
            echo "Site returns HTTP $STATUS - FAILED"
            exit 1
          fi

      - name: Notify Slack — success
        if: steps.smoke_test.outcome == 'success' && vars.SLACK_WEBHOOK
        run: |
          curl -s -X POST ${{ vars.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"Deploy OK\nSite: ${{ vars.SITE_URL }}\nBy: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"

      - name: Notify Slack — failure
        if: steps.smoke_test.outcome == 'failure' && vars.SLACK_WEBHOOK
        run: |
          curl -s -X POST ${{ vars.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"Deploy FAILED — smoke test did not pass\nSite: ${{ vars.SITE_URL }}\nHTTP status: ${{ steps.smoke_test.outputs.status }}\nBy: ${{ github.actor }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\nRun the Rollback workflow manually if needed.\"}"

      - name: Fail workflow if smoke test failed
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "Deploy completed but smoke test failed."
          echo "Run the 'Rollback' workflow manually to revert."
          exit 1
